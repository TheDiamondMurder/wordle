<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordle</title>
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="game-page" aria-labelledby="page-title">
      <section class="intro">
        <div class="brand" aria-label="wordle">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>wordle</span>
        </div>

        <h1 id="page-title">wordle</h1>
        <p class="lede">daily word, six guesses, one shot</p>
      </section>

      <section class="panel wordle-panel" aria-live="polite">
        <div class="game-topline">
          <span id="puzzle-date">loading</span>
          <span id="status-label">daily puzzle</span>
        </div>

        <div class="board" id="board" aria-label="Wordle board"></div>

        <div class="keyboard" id="keyboard" aria-label="Keyboard"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="modal-backdrop" id="result-modal" hidden>
      <section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p class="tools-kicker">results</p>
        <h2 id="modal-title">daily complete</h2>
        <p id="modal-detail"></p>
        <div class="result-grid" id="result-grid"></div>
        <button class="button button-light" id="close-modal" type="button">Done</button>
      </section>
    </div>

    <script src="script.js?v=7"></script>
  </body>
</html>
